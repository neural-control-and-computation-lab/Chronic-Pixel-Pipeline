[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chronic-pixel-pipeline"
version = "0.1.0"
description = "Toolbox for processing chronic Neuropixels recordings from SpikeGadgets wireless data logger"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "numpy>=1.20",
    "spikeinterface>=0.100",
    "probeinterface>=0.2.17",
]

[project.optional-dependencies]
sorting = [
    "kilosort>=4.0",
    "torch>=2.0",
]
analysis = [
    "matplotlib>=3.5",
]
all = [
    "chronic-pixel-pipeline[sorting,analysis]",
]
dev = [
    "chronic-pixel-pipeline[all]",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

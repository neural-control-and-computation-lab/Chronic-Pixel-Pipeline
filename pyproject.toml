[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chronic-pixel-pipeline"
version = "0.2.0"
description = "Toolbox for processing chronic Neuropixels recordings from SpikeGLX and SpikeGadgets wireless data loggers"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.5",
    "scikit-learn>=1.2",
    "spikeinterface>=0.100",
    "probeinterface>=0.2.17",
]

[project.optional-dependencies]
sorting = [
    "kilosort>=4.0",
    "torch>=2.0",
]
analysis = [
    "matplotlib>=3.5",
]
all = [
    "chronic-pixel-pipeline[sorting,analysis]",
]
dev = [
    "chronic-pixel-pipeline[all]",
    "pytest>=7.0",
]

[project.scripts]
cpp-scan = "chronic_pixel_pipeline.scripts.timescan:main"
cpp-sort = "chronic_pixel_pipeline.scripts.sort:main"

[tool.setuptools.packages.find]
where = ["src"]
